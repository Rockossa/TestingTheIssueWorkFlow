name: Move Issue to In Progress When Feature Branch Is Created

on:
  create:

jobs:
  move_status:
    runs-on: ubuntu-latest

    permissions:
      issues: write
      contents: read

    steps:
      - name: Debug event
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref name: ${{ github.ref_name }}"
          echo "Full event JSON:"
          echo '${{ toJson(github.event) }}'

      - name: Extract issue number from branch name
        id: extract
        run: |
          ref="${{ github.ref_name }}"
          echo "Branch name: $ref"

          if [[ "$ref" =~ ([0-9]+) ]]; then
            echo "Found issue number: ${BASH_REMATCH[1]}"
            echo "issue_number=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          else
            echo "No issue number found"
            echo "issue_number=" >> $GITHUB_OUTPUT
          fi

      - name: Stop if no issue number found
        if: steps.extract.outputs.issue_number == ''
        run: echo "No issue number found in branch name. Skipping."

      - name: Get issue node ID
        id: issue
        if: steps.extract.outputs.issue_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            console.log("Fetching issue:", ${{ steps.extract.outputs.issue_number }});
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.extract.outputs.issue_number }}
            });
            console.log("Issue node ID:", issue.data.node_id);
            return issue.data.node_id;

      - name: Update Project Status → In progress
        if: steps.extract.outputs.issue_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const issueNodeId = `${{ steps.issue.outputs.result }}`;
            console.log("Updating project status for item:", issueNodeId);

            try {
              const result = await github.graphql(`
                mutation(
                  $project: ID!,
                  $item: ID!,
                  $field: ID!,
                  $option: String!
                ) {
                  updateProjectV2ItemFieldValue(
                    input: {
                      projectId: $project,
                      itemId: $item,
                      fieldId: $field,
                      value: { singleSelectOptionId: $option }
                    }
                  ) {
                    clientMutationId
                  }
                }
              `, {
                project: "1",
                item: `${issueNodeId}`,
                field: "PVTSSF_lAHOCR0Qes4BVRSmzhQuPKw",
                option: "47fc9ee4"
              });

              console.log("GraphQL result:", result);
            } catch (err) {
              console.log("GraphQL ERROR:", err);
              throw err;
            }
