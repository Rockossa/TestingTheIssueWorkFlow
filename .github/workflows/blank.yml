name: Move Issue to In Progress When Feature Branch Is Created

on:
  create:

jobs:
  move_status:
    runs-on: ubuntu-latest

    permissions:
      issues: write
      contents: read

    steps:
      - name: Extract issue number from branch name
        id: extract
        run: |
          ref="${{ github.ref_name }}"

          # Extract first number found in branch name
          if [[ "$ref" =~ ([0-9]+) ]]; then
            echo "issue_number=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          else
            echo "issue_number=" >> $GITHUB_OUTPUT
          fi

      - name: Stop if no issue number found
        if: steps.extract.outputs.issue_number == ''
        run: echo "No issue number found in branch name. Skipping."

      - name: Get issue node ID
        id: issue
        if: steps.extract.outputs.issue_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.extract.outputs.issue_number }}
            });
            return issue.data.node_id;

      - name: Update Project Status → In progress
        if: steps.extract.outputs.issue_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const issueNodeId = "${{ steps.issue.outputs.result }}";

            await github.graphql(`
              mutation(
                $project: ID!,
                $item: ID!,
                $field: ID!,
                $option: String!
              ) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $project,
                    itemId: $item,
                    fieldId: $field,
                    value: { singleSelectOptionId: $option }
                  }
                ) {
                  clientMutationId
                }
              }
            `, {
              project: "1",
              item: issueNodeId,
              field: "PVTSSF_lAHOCR0Qes4BVRSmzhQuPKw",
              option: "47fc9ee4"   // In progress
            });
